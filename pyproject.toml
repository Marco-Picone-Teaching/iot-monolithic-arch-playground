[project]
name = "iot-monolithic-arch-playground"
version = "0.1.0"
description = "IoT Monolithic Architecture Playground - n-Tier IoT application with Web Server, RESTful API and MQTT Data Fetcher"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3,<3",
    "flask-restful>=0.3.10",
    "paho-mqtt>=2.1,<3",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
iot-monolith = "iot_monolithic_playground.main:main"
mqtt-device-producer = "iot_monolithic_playground.tester.mqtt.json_producer:main"
mqtt-telemetry-consumer = "iot_monolithic_playground.tester.mqtt.json_consumer:main"
create-location = "iot_monolithic_playground.tester.http.create_location:main"
create-device = "iot_monolithic_playground.tester.http.create_device:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "iot_monolithic_playground"
